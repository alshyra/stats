<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — Trafic</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a14; --surface: #14142a; --border: #1e1e3a;
  --text: #e2e8f0; --muted: #64748b; --accent: #06b6d4;
  --accent-dim: rgba(6,182,212,0.15); --amber: #f59e0b;
  --emerald: #10b981; --red: #ef4444; --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
}
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding: 2rem 1.5rem; line-height: 1.5;
}
.container { max-width: 1360px; margin: 0 auto; }

/* Header */
.header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
.header h1 { font-size: 1.65rem; font-weight: 600; display: flex; align-items: center; gap: 0.6rem; }
.header h1 svg { width: 28px; height: 28px; }
.header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.header-date { font-size: 0.85rem; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 1rem; }

/* Domain filter */
.domain-select {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 0.45rem 0.75rem; border-radius: 8px;
  font-size: 0.85rem; cursor: pointer; outline: none;
}
.domain-select:focus { border-color: var(--accent); }
.domain-select option { background: var(--surface); color: var(--text); }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5rem 2rem; text-align: center; }
.empty-state svg { width: 64px; height: 64px; opacity: 0.3; margin-bottom: 1.5rem; }
.empty-state h2 { font-size: 1.3rem; font-weight: 500; color: var(--muted); }

/* Cards */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; box-shadow: var(--shadow); }
.total-card { display: flex; flex-direction: column; gap: 0.35rem; }
.total-card .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 500; }
.total-card .value { font-size: 1.8rem; font-weight: 700; line-height: 1.2; }
.total-card .sub { font-size: 0.82rem; color: var(--muted); }

.row { margin-bottom: 1.5rem; }
.grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
.grid-equal { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5rem; }
@media (max-width: 1024px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 700px) {
  body { padding: 1rem 0.75rem; }
  .grid-3 { grid-template-columns: 1fr; } .grid-equal { grid-template-columns: 1fr; }
  .totals { grid-template-columns: repeat(2, 1fr); }
  .header h1 { font-size: 1.3rem; } .total-card .value { font-size: 1.4rem; }
}
@media (max-width: 420px) { .totals { grid-template-columns: 1fr; } }

.card-title { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; margin-bottom: 1rem; }
.chart-wrapper { position: relative; height: 240px; }
.chart-wrapper canvas { width: 100% !important; height: 100% !important; }

.bar-list { display: flex; flex-direction: column; gap: 0.5rem; }
.bar-row { display: flex; align-items: center; gap: 0.75rem; }
.bar-row .bar-label { font-size: 0.82rem; flex: 0 0 auto; min-width: 6.5rem; max-width: 10rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .bar-track { flex: 1; height: 22px; background: var(--border); border-radius: 4px; overflow: hidden; position: relative; }
.bar-row .bar-fill { height: 100%; border-radius: 4px; min-width: 2px; transition: width 0.6s ease; }
.bar-row .bar-count { font-size: 0.78rem; color: var(--muted); flex: 0 0 3.5rem; text-align: right; }

.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
table.data th { text-align: left; padding: 0.5rem 0.75rem; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data td { padding: 0.45rem 0.75rem; border-bottom: 1px solid rgba(30,30,58,0.5); max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.data tr:last-child td { border-bottom: none; }
table.data .num { text-align: right; font-variant-numeric: tabular-nums; }
.pct-bar { display: inline-block; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 0.4rem; }

.status-list { display: flex; flex-direction: column; gap: 0.5rem; }
.list-compact { display: flex; flex-direction: column; gap: 0.35rem; }
.list-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; padding: 0.3rem 0; border-bottom: 1px solid rgba(30,30,58,0.3); }
.list-item:last-child { border-bottom: none; }
.list-item .key { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-item .val { color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app" class="container">
  <!-- Header -->
  <header class="header">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg>
      Trafic
    </h1>
    <div class="header-right">
      <select class="domain-select" v-model="selectedDomain">
        <option value="">Tous les domaines</option>
        <option v-for="d in domains" :key="d" :value="d">{{ d }}</option>
      </select>
      <span class="header-date">{{ dateLabel }}</span>
    </div>
  </header>

  <!-- Empty state -->
  <div v-if="!data" class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg>
    <h2>En attente de données de trafic</h2>
  </div>

  <template v-if="data">
    <!-- System stats -->
    <div v-if="sys" class="totals" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));">
      <div class="card total-card">
        <span class="label">CPU</span>
        <span class="value">{{ sys.cpu }}%</span>
      </div>
      <div class="card total-card">
        <span class="label">RAM</span>
        <span class="value">{{ sys.memory?.percent || 0 }}%</span>
        <span class="sub">{{ formatBytes(sys.memory?.used) }} / {{ formatBytes(sys.memory?.total) }}</span>
      </div>
      <div class="card total-card">
        <span class="label">Disque</span>
        <span class="value">{{ sys.disk }}%</span>
      </div>
      <div class="card total-card">
        <span class="label">Uptime</span>
        <span class="value" style="font-size:1.1rem;">{{ sys.uptime }}</span>
      </div>
      <div class="card total-card">
        <span class="label">Fail2ban</span>
        <span class="value" :style="{color: sys.fail2ban?.banned_count > 0 ? 'var(--amber)' : 'var(--emerald)'}">{{ sys.fail2ban?.banned_count || 0 }}</span>
        <span class="sub">IPs bannies</span>
      </div>
    </div>

    <!-- Totals -->
    <div class="totals">
      <div class="card total-card"><span class="label">Visiteurs uniques</span><span class="value">{{ f(g.unique_visitors) }}</span></div>
      <div class="card total-card"><span class="label">Requêtes totales</span><span class="value">{{ f(g.total_requests) }}</span></div>
      <div class="card total-card"><span class="label">Pages consultées</span><span class="value">{{ f(g.unique_files) }}</span><span class="sub">{{ f(sumHits(data.requests)) }} hits</span></div>
      <div class="card total-card"><span class="label">Bots / Crawlers</span><span class="value">{{ botPct.toFixed(1) }}%</span><span class="sub">{{ f(botHits) }} requêtes</span></div>
    </div>

    <!-- Chart + Pages -->
    <div class="row grid-2">
      <div class="card">
        <div class="card-title">Visiteurs par jour</div>
        <div v-if="data.visitors && data.visitors.length" class="chart-wrapper"><canvas ref="chartCanvas"></canvas></div>
        <div v-else style="padding:2rem 0;text-align:center;color:var(--muted);font-size:0.9rem;">Données journalières non disponibles</div>
      </div>
      <div class="card">
        <div class="card-title">Pages les plus consultées</div>
        <div class="table-wrap">
          <table v-if="data.requests && data.requests.length" class="data">
            <thead><tr><th>Page</th><th class="num">Hits</th><th class="num">%</th></tr></thead>
            <tbody>
              <tr v-for="p in data.requests.slice(0, 15)" :key="p.data">
                <td :title="p.data">{{ shortUrl(p.data) }}</td>
                <td class="num">{{ f(p.hits.count) }}</td>
                <td class="num"><span class="pct-bar" :style="{width: (p.hits.count/maxPageHits)*50 + 'px', background: 'var(--accent)'}"></span>{{ pct(p.hits.count, totalHits).toFixed(1) }}%</td>
              </tr>
            </tbody>
          </table>
          <div v-else style="color:var(--muted);font-size:0.85rem;padding:0.5rem 0;">Aucune donnée</div>
        </div>
      </div>
    </div>

    <!-- Browsers + OS + Status -->
    <div class="row grid-3">
      <!-- Browsers -->
      <div class="card">
        <div class="card-title">Navigateurs</div>
        <div class="bar-list">
          <template v-if="data.browsers && data.browsers.length">
            <div class="bar-row" v-for="(b, i) in data.browsers.slice(0, 8)" :key="b.data">
              <span class="bar-label" :title="b.data">{{ b.data }}</span>
              <div class="bar-track"><div class="bar-fill" :style="{width: pct(b.hits.count, maxBrowserHits) + '%', background: browserColors[i % browserColors.length]}"></div></div>
              <span class="bar-count">{{ f(b.hits.count) }}</span>
            </div>
          </template>
          <div v-else style="color:var(--muted);font-size:0.85rem;">Aucune donnée</div>
        </div>
      </div>
      <!-- OS -->
      <div class="card">
        <div class="card-title">Systèmes d'exploitation</div>
        <div class="bar-list">
          <template v-if="data.os && data.os.length">
            <div class="bar-row" v-for="(o, i) in data.os.slice(0, 6)" :key="o.data">
              <span class="bar-label" :title="o.data">{{ o.data }}</span>
              <div class="bar-track"><div class="bar-fill" :style="{width: pct(o.hits.count, maxOSHits) + '%', background: osColors[i % osColors.length]}"></div></div>
              <span class="bar-count">{{ f(o.hits.count) }}</span>
            </div>
          </template>
          <div v-else style="color:var(--muted);font-size:0.85rem;">Aucune donnée</div>
        </div>
      </div>
      <!-- Status codes -->
      <div class="card">
        <div class="card-title">Codes de statut</div>
        <div class="status-list">
          <template v-if="statusGrouped.length">
            <div class="bar-row" v-for="s in statusGrouped" :key="s.code">
              <span class="bar-label" style="min-width:6rem;">{{ statusLabel(s.code) }}</span>
              <div class="bar-track"><div class="bar-fill" :style="{width: s.pct + '%', background: statusColor(s.code)}"></div></div>
              <span class="bar-count">{{ f(s.hits) }} ({{ s.pct.toFixed(1) }}%)</span>
            </div>
          </template>
          <div v-else style="color:var(--muted);font-size:0.85rem;">Aucune donnée</div>
        </div>
      </div>
    </div>

    <!-- 404 + Domaines -->
    <div class="row grid-equal">
      <div class="card">
        <div class="card-title">Pages 404</div>
        <div class="list-compact">
          <template v-if="data.not_found && data.not_found.length">
            <div class="list-item" v-for="n in data.not_found.slice(0, 10)" :key="n.data">
              <span class="key" :title="n.data">{{ n.data }}</span>
              <span class="val">{{ f(n.hits.count) }}</span>
            </div>
          </template>
          <div v-else style="color:var(--muted);font-size:0.85rem;">Aucune erreur 404</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Domaines</div>
        <div class="list-compact">
          <template v-if="data.hosts && data.hosts.length">
            <div class="list-item" v-for="h in data.hosts.slice(0, 10)" :key="h.data">
              <span class="key">{{ h.data }}</span>
              <span class="val">{{ f(h.hits.count) }}</span>
            </div>
          </template>
          <div v-else style="color:var(--muted);font-size:0.85rem;">Aucune donnée</div>
        </div>
      </div>
    </div>
  </template>
</div>

<script>
const { createApp, ref, computed, watch, onMounted, nextTick } = Vue;

createApp({
  setup() {
    const raw = ref(null);
    const sys = ref(null);
    const selectedDomain = ref('');
    const chartCanvas = ref(null);
    let chartInstance = null;

    // Colors
    const browserColors = ['#06b6d4','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7','#d946ef','#ec4899'];
    const osColors = ['#f59e0b','#f97316','#ef4444','#10b981','#14b8a6','#06b6d4'];

    // Helpers
    const f = (n) => (n || 0).toLocaleString('fr-FR');
    const pct = (v, total) => total > 0 ? ((v / total) * 100) : 0;
    const shortUrl = (s) => {
      const clean = s.replace(/\?.*$/, '');
      return clean.length > 50 ? clean.slice(0, 47) + '...' : clean;
    };
    const sumHits = (arr) => arr ? arr.reduce((a, v) => a + (v.hits?.count || 0), 0) : 0;
    const formatBytes = (b) => {
      if (!b) return '0 B';
      const units = ['B','KB','MB','GB','TB'];
      let i = 0;
      let v = b;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return v.toFixed(1) + ' ' + units[i];
    };
    const botKeywords = ['bot','crawler','spider','curl','Go-http-client','Python','Wget','Scan','Headless','Apache-Http','Java','libwww','perl','ruby','php','axios','node-fetch'];

    // Computed: display data (aggregate or per-domain)
    const data = computed(() => {
      if (!raw.value) return null;
      if (selectedDomain.value && raw.value.by_domain?.[selectedDomain.value]) {
        return raw.value.by_domain[selectedDomain.value];
      }
      return raw.value;
    });

    const g = computed(() => data.value?.general || {});

    const domains = computed(() => raw.value?.domains || []);

    const dateLabel = computed(() => {
      const gen = data.value?.general?.date_time || '';
      if (gen) {
        try { return new Date(gen).toLocaleDateString('fr-FR', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
        catch { return gen; }
      }
      return '';
    });

    const totalHits = computed(() => g.value.total_requests || 0);

    const maxPageHits = computed(() => {
      const r = data.value?.requests;
      return r?.length ? r[0].hits.count : 1;
    });
    const maxBrowserHits = computed(() => {
      const b = data.value?.browsers;
      return b?.length ? b[0].hits.count : 1;
    });
    const maxOSHits = computed(() => {
      const o = data.value?.os;
      return o?.length ? o[0].hits.count : 1;
    });

    // Bot detection
    const botHits = computed(() => {
      const browsers = data.value?.browsers || [];
      let total = 0;
      browsers.forEach(b => {
        if (botKeywords.some(k => b.data.toLowerCase().includes(k.toLowerCase()))) {
          total += b.hits?.count || 0;
        }
      });
      return total;
    });
    const botPct = computed(() => pct(botHits.value, totalHits.value));

    // Status codes grouped
    const statusGrouped = computed(() => {
      const sc = data.value?.status_codes || [];
      const labels = { '2': '2xx Succès', '3': '3xx Redirections', '4': '4xx Erreurs client', '5': '5xx Erreurs serveur', '0': 'Autres' };
      const colors = { '2': '#10b981', '3': '#06b6d4', '4': '#f59e0b', '5': '#ef4444', '0': '#64748b' };
      const total = sc.reduce((a, s) => a + (s.hits?.count || 0), 0) || 1;
      return sc.map(s => {
        const prefix = s.data.charAt(0);
        return { code: prefix, hits: s.hits?.count || 0, pct: pct(s.hits?.count || 0, total), label: labels[prefix] || prefix + 'xx', color: colors[prefix] || '#64748b' };
      });
    });
    const statusLabel = (c) => {
      const labels = { '2': '2xx Succès', '3': '3xx Redirections', '4': '4xx Erreurs client', '5': '5xx Erreurs serveur', '0': 'Autres' };
      return labels[c] || c + 'xx';
    };
    const statusColor = (c) => {
      const colors = { '2':'#10b981', '3':'#06b6d4', '4':'#f59e0b', '5':'#ef4444', '0':'#64748b' };
      return colors[c] || '#64748b';
    };

    // Chart rendering
    const renderChart = () => {
      nextTick(() => {
        const visitors = data.value?.visitors;
        if (!visitors || !visitors.length || !chartCanvas.value) {
          if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
          return;
        }
        if (chartInstance) chartInstance.destroy();
        const ctx = chartCanvas.value.getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: visitors.map(v => v.data),
            datasets: [{
              label: 'Visiteurs',
              data: visitors.map(v => v.visitors?.count || 1),
              borderColor: '#06b6d4',
              backgroundColor: 'rgba(6,182,212,0.1)',
              fill: true,
              tension: 0.3,
              pointRadius: 3,
              pointHoverRadius: 5,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { ticks: { color: '#64748b', maxTicksLimit: 10 }, grid: { color: 'rgba(30,30,58,0.5)' } },
              y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(30,30,58,0.5)' }, beginAtZero: true }
            }
          }
        });
      });
    };

    // Watch for domain change or data change → re-render chart
    watch([data, chartCanvas], renderChart, { deep: true });

    // Fetch data
    const fetchData = async () => {
      try {
        const res = await fetch('/api/stats', { signal: AbortSignal.timeout(8000) });
        if (res.ok) raw.value = await res.json();
      } catch {}
    };

    onMounted(async () => {
      await fetchData();
      renderChart();
      setInterval(fetchData, 30000);
      const fetchSys = async () => {
        try {
          const r = await fetch('/api/system', { signal: AbortSignal.timeout(5000) });
          if (r.ok) sys.value = await r.json();
        } catch {}
      };
      await fetchSys();
      setInterval(fetchSys, 60000);
    });

    return { data, g, domains, selectedDomain, sys, chartCanvas, dateLabel,
             f, pct, shortUrl, sumHits, formatBytes, botHits, botPct,
             statusGrouped, statusLabel, statusColor,
             maxPageHits, maxBrowserHits, maxOSHits,
             browserColors, osColors, totalHits };
  }
}).mount('#app');
</script>
</body>
</html>
